name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Docs can't change the build; content Markdown under src/ can, so the filter names
    # files rather than `**.md`. Push only: on a pull_request a path-filtered skip never
    # reports, and the required checks would sit pending.
    paths-ignore: ['README.md', 'CONTEXT.md', '.github/*.md']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Astro's incremental build cache lives in `node_modules/.astro`. The font files are
      # read from disk at build time and invisible to Astro's dependency graph, so they're
      # folded into the key by hand, like the OG endpoint's own `cacheKey`.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/assets/fonts/og/*') }}

      - run: pnpm exec playwright install --with-deps chromium

      # Built with a placeholder analytics key, as deploy.yml builds with the real one, so the
      # byte budgets and the zero-JS e2e measure content pages with the beacon in them. The
      # key is the same length as a real one (`phc_` + 43); nothing is sent, because the
      # preview server has no `/ingest` and the e2e spec asserts nothing leaves localhost.
      - run: pnpm verify
        env:
          PUBLIC_POSTHOG_KEY: phc_ci_placeholder_0000000000000000000000000000

      # The keyless shape (dev, forks, no `POSTHOG_KEY` secret): no beacon, no `/ingest`.
      - name: Keyless build emits no analytics
        env:
          PUBLIC_POSTHOG_KEY: ''
        run: |
          pnpm exec astro build --outDir dist-keyless
          if grep -rlE 'sendBeacon|/ingest' dist-keyless --include=index.html; then
            echo "::error::a keyless build emitted analytics"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # CLS and resource sizes block; LCP and TBT only warn. Reuses the `verify` job's
  # `dist/` so the numbers are for the exact build that just passed the byte budgets.
  lighthouse:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Both configs upload to temporary public storage; keep the report links.
      - name: Lighthouse CI
        run: |
          set -o pipefail
          pnpm lighthouse 2>&1 | tee lhci.log

      - name: Post report links
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          links=$(grep -o 'https://storage.googleapis.com/[^ ]*report.html' lhci.log | sed 's/^/- /' || true)
          [ -n "$links" ] || exit 0
          printf '### Lighthouse reports\n\n%s\n' "$links" | tee -a "$GITHUB_STEP_SUMMARY" > body.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file body.md
